[package]
name = "sorter"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "macOS background daemon that sorts downloaded files into category subfolders"
authors = ["abhishek-shivale"]
repository = "https://github.com/abhishek-shivale/sorter"
readme = "README.md"
keywords = ["downloads", "daemon", "launchd", "macos", "organizer"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"
serde = { version = "1", features = ["derive"] }
dirs = "7.0.0"
toml = "1.2.0"
toml_edit = "0.25.18"

[profile.release]
lto = true
codegen-units = 1
strip = true
